name: Build MCWiiU Launcher

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-launcher-windows:
    name: Launcher Windows x64 (${{ matrix.variant }})
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: development
            configuration: RelWithDebInfo
            directory: runtime-relwithdebinfo
          - variant: release
            configuration: Release
            directory: runtime-release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Configure launcher
        run: cmake --preset launcher-${{ matrix.variant }}
      - name: Build launcher
        shell: pwsh
        run: |
          cmake --build --preset launcher-${{ matrix.variant }} --parallel 2 2>&1 | Tee-Object -FilePath '../_work/launcher-build.log'
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed.' }
          if (Select-String -LiteralPath '../_work/launcher-build.log' -Pattern 'LNK4098|LNK4286|LNK2038') {
            throw 'Launcher CRT validation failed.'
          }
      - name: Verify source tree cleanliness
        shell: pwsh
        run: |
          $changes = git status --porcelain --untracked-files=all --ignored
          if ($LASTEXITCODE -ne 0 -or $changes) {
            $changes | Write-Output
            throw 'The launcher build changed the source tree.'
          }
      - name: Resolve executable path
        id: executable
        shell: pwsh
        run: |
          $executable = Get-Item -LiteralPath '../_work/build/${{ matrix.directory }}/bin/${{ matrix.configuration }}/MCWiiU Launcher.exe'
          "path=$($executable.FullName)" >> $env:GITHUB_OUTPUT
      - name: Upload test executable
        uses: actions/upload-artifact@v6
        with:
          name: mcwiiu-launcher-windows-x64-${{ matrix.variant }}
          path: ${{ steps.executable.outputs.path }}
          if-no-files-found: error
          retention-days: 7
